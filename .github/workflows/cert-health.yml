name: Validación de certificación (pre-producción)

# Valida cada versión en el entorno de cert ANTES de que pase a producción.
# Corre el mismo barrido de cliente que el nocturno (CERT_MODE=1) contra la
# base de cert, con autodetección de su Supabase y chequeo de aislamiento.
#
# Disparo:
#   - Tras cada "Deploy Cert" (espera a que Pages publique el nuevo build).
#   - Cada noche 02:15 UTC + manual (input base_url para validar otro espejo).
#
# Base: input base_url → variable CERT_BASE_URL → Q19-CERT por defecto.
#   (Si el espejo migra a GEN-YOGA-CERT, basta fijar la variable.)
# Falla y abre issue `cert` + `ai-fix` si: manifiesto incoherente, cert
# apuntando al Supabase de producción, backend roto, errores JS, acciones
# de cliente rotas, etc.

on:
  workflow_run:
    workflows: ["Deploy Cert"]
    types: [completed]
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base a validar (vacío = variable CERT_BASE_URL o Q19-CERT)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: cert-health
  cancel-in-progress: false

jobs:
  cert:
    name: Validar versión en cert
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CERT_MODE: '1'
      CERT_BASE: ${{ inputs.base_url || vars.CERT_BASE_URL || 'https://gen-yoga-studio.github.io/Q19-CERT/' }}
      GEN_YOGA_TEST_EMAIL: ${{ secrets.GEN_YOGA_TEST_EMAIL }}
      GEN_YOGA_TEST_PASSWORD: ${{ secrets.GEN_YOGA_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Instalar Chromium
        run: |
          CORE_VER=$(node -p "require('./node_modules/playwright-core/package.json').version")
          npx -y playwright@$CORE_VER install --with-deps chromium
      - name: Esperar publicación en Pages
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        env:
          RUN_STARTED: ${{ github.event.workflow_run.created_at }}
        run: |
          echo "Base: $CERT_BASE (deploy ${{ github.event.workflow_run.head_sha }})"
          SEEN=0
          for i in $(seq 1 8); do
            CODE=$(curl -s -o /tmp/cert.json -w '%{http_code}' "$CERT_BASE/cert.json" || echo 000)
            if [ "$CODE" = "200" ]; then
              SEEN=1
              BUILT=$(node -p "try{JSON.parse(require('fs').readFileSync('/tmp/cert.json','utf8')).construido||''}catch(e){''}")
              echo "manifiesto construido=$BUILT run=$RUN_STARTED"
              if [ -n "$BUILT" ] && [[ "$BUILT" > "$RUN_STARTED" ]]; then echo "✅ Nuevo build publicado."; break; fi
            else
              echo "sin manifiesto (intento $i/8)"
            fi
            [ "$i" = "8" ] && break
            sleep 60
          done
          if [ "$SEEN" = "0" ]; then echo "⚠️ Sin manifiesto (cert legacy): margen extra para Pages."; sleep 120; fi
      - name: Validar cert como un cliente
        run: PROD_BASE_URL="$CERT_BASE" npm run check:cert
      - name: Subir informe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cert-report
          path: nightly-reports/
          retention-days: 30
          if-no-files-found: warn
      - name: Publicar resumen en GitHub Actions
        if: always()
        run: |
          node scripts/nightly-step-summary.mjs nightly-reports/cert-action.json >> "$GITHUB_STEP_SUMMARY" || true
          node scripts/analizar-informe-diario.mjs --cert --append-summary || true
      - name: Generar autorreporte para la IA
        if: always()
        run: CERT_MODE=1 node scripts/nightly-issue-body.mjs nightly-reports/cert-action.json > nightly-reports/cert-issue-body.md || echo "sin cuerpo"
      - name: Abrir issue si la versión no pasa
        id: open-issue
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const MARK = '<!-- cert-issue -->';
            const TITLE = '🧪 Cert: la versión no pasa la validación';
            const { owner, repo } = context.repo;
            let body;
            try {
              body = fs.readFileSync('nightly-reports/cert-issue-body.md', 'utf8');
            } catch {
              body = '';
            }
            if (!body || !body.trim()) {
              body = 'Validación de cert fallida sin autorreporte: revisar el artefacto `cert-report`.';
            }
            if (!body.includes(MARK)) body = `${MARK}\n${body}`;
            body += `\nEjecución: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            async function findOpenIssue() {
              const base = { owner, repo, state: 'open', per_page: 100 };
              const scan = async (extra) => {
                const list = await github.paginate(github.rest.issues.listForRepo, { ...base, ...extra });
                return list.find((i) => !i.pull_request &&
                  ((i.body || '').includes(MARK) || i.title === TITLE)) || null;
              };
              return (await scan({ labels: 'cert' })) || (await scan({}));
            }

            const dup = await findOpenIssue();
            let issueNumber;
            const newSig = (body.match(/<!-- failure-signature: ([a-f0-9]+) -->/) || [])[1];
            const oldSig = dup ? ((dup.body || '').match(/<!-- failure-signature: ([a-f0-9]+) -->/) || [])[1] : null;
            const sameSignature = Boolean(dup && newSig && oldSig && newSig === oldSig);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            if (dup) {
              issueNumber = dup.number;
              await github.rest.issues.update({ owner, repo, issue_number: dup.number, body });
              const names = (dup.labels || []).map((l) => (typeof l === 'string' ? l : l.name));

              if (sameSignature) {
                // Misma firma de fallos: no inundar con el cuerpo completo ni reintentar autofix indefinidamente
                await github.rest.issues.createComment({
                  owner, repo, issue_number: dup.number,
                  body: `🔄 **Nueva validación de cert en rojo (Ejecución #${context.runNumber})**\n\nPersisten los mismos fallos sin variación en la firma de errores.\n- Fecha: ${new Date().toISOString()}\n- Ver ejecución: [Ejecución #${context.runNumber}](${runUrl})`,
                });
              } else {
                // Firma distinta o nueva combinación de fallos: actualizar y notificar cambio
                await github.rest.issues.createComment({
                  owner, repo, issue_number: dup.number,
                  body: `🔄 **Nueva validación de cert: variación en fallos detectada (Ejecución #${context.runNumber})**\n\nSe ha detectado un cambio en la firma de fallos respecto a la ejecución anterior.\n\n${body}`,
                });
                if (names.includes('autofix-intentado')) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: dup.number, name: 'autofix-intentado' });
                }
              }

              if (!names.includes('ai-fix')) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: dup.number, labels: ['ai-fix'] });
              }
              core.setOutput('number', String(dup.number));
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title: TITLE, body, labels: ['cert', 'ai-fix'],
              });
              issueNumber = created.data.number;
              core.setOutput('number', String(issueNumber));
            }

            // Disparo automático de autofix: solo si es issue nuevo o si la firma cambió
            const shouldDispatchAutofix = !dup || !sameSignature || !(dup.labels || []).some((l) => (typeof l === 'string' ? l : l.name) === 'autofix-intentado');
            if (shouldDispatchAutofix) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo,
                  workflow_id: 'nightly-autofix.yml',
                  ref: 'main',
                  inputs: { issue_number: String(issueNumber) },
                });
                console.log(`🤖 Autofix disparado automáticamente para el issue de cert #${issueNumber}`);
              } catch (err) {
                console.log(`ℹ️ No se pudo disparar autofix automático (${err.message}). El issue queda abierto con ai-fix.`);
              }
            } else {
              console.log(`ℹ️ Autofix ya intentado previamente para esta misma firma de fallos en cert. No se reintenta para evitar bucles.`);
            }
      - name: Cerrar issue si la versión pasa
        id: close-issue
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const MARK = '<!-- cert-issue -->';
            const TITLE = '🧪 Cert: la versión no pasa la validación';
            const { owner, repo } = context.repo;
            const base = { owner, repo, state: 'open', per_page: 100 };
            const scan = async (extra) => {
              const list = await github.paginate(github.rest.issues.listForRepo, { ...base, ...extra });
              return list.find((i) => !i.pull_request &&
                ((i.body || '').includes(MARK) || i.title === TITLE)) || null;
            };
            const dup = (await scan({ labels: 'cert' })) || (await scan({}));
            if (dup) {
              const body = `✅ **Validación de cert recuperada en verde**: Todas las comprobaciones han pasado con éxito.\nEjecución: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
              await github.rest.issues.createComment({ owner, repo, issue_number: dup.number, body });
              const names = (dup.labels || []).map((l) => (typeof l === 'string' ? l : l.name));
              if (names.includes('ai-fix')) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: dup.number, name: 'ai-fix' });
              }
              await github.rest.issues.update({ owner, repo, issue_number: dup.number, state: 'closed' });
              core.setOutput('number', String(dup.number));
            }
      - name: Notificación de alerta (Webhook)
        if: always()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ job.status }}" = "failure" ]; then
            node scripts/nightly-notify.mjs failure nightly-reports/cert-action.json || true
          elif [ "${{ job.status }}" = "success" ]; then
            node scripts/nightly-notify.mjs success nightly-reports/cert-action.json || true
          fi
