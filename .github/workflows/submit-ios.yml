name: Submit iOS to Review

# Automatiza el proceso post-TestFlight de App Store Connect:
#   versión (crear/reutilizar) → esperar build → asociar → novedades → enviar a revisión.
# Se lanza a mano cuando el build ya está subido (o el script espera hasta 40 min):
#   gh workflow run submit-ios --ref main -f version=13.13 -f build=252
# Usa el secreto existente APP_STORE_CONNECT_PRIVATE_KEY (misma clave que deploy-ios).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión de App Store (p. ej. 13.13; vacío = la del repo)'
        required: false
        default: ''
      build:
        description: 'Build number (vacío = el del repo)'
        required: false
        default: ''
      whats-new:
        description: 'Novedades para la ficha'
        required: false
        default: 'Correcciones y mejoras'
  workflow_run:
    workflows: ['Deploy iOS App to App Store Connect']
    types: [completed]

jobs:
  submit:
    # En cadena automática solo si el deploy fue verde; manual siempre.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolver versión/build (auto si viene encadenado)
        id: ver
        run: |
          VERSION="${{ inputs.version }}"
          [ -z "$VERSION" ] && VERSION=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          BUILD="${{ inputs.build }}"
          [ -z "$BUILD" ] && BUILD=$(grep -m1 'versionCode' "app android/android/app/build.gradle" | grep -o '[0-9]*')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "📦 Submit v$VERSION (build $BUILD)"
      - name: Enviar versión a revisión
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          node scripts/submit-testflight.mjs \
            --version "${{ steps.ver.outputs.version }}" \
            --build "${{ steps.ver.outputs.build }}" \
            --whats-new "${{ inputs.whats-new || 'Correcciones y mejoras' }}"
