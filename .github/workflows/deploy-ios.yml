name: Deploy iOS App to App Store Connect

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes / description'
        required: false
        default: 'Release v6.42: Unified classes, teacher profiles, and Farmacia Q19 alliance'

jobs:
  build-and-deploy:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app ios/package-lock.json'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install dependencies & Sync Capacitor
        run: |
          cd "app ios"
          npm install
          npx cap sync ios

      - name: Setup App Store Connect API Key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          ACTUAL_KEY_ID="${KEY_ID:-9T2974ST9M}"
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ACTUAL_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ACTUAL_KEY_ID}.p8

      - name: Setup Fastlane
        run: |
          cd "app ios"
          bundle init || true
          echo 'gem "fastlane"' >> Gemfile
          bundle install

      - name: Build & Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          cd "app ios"
          export APP_STORE_CONNECT_KEY_ID="${APP_STORE_CONNECT_KEY_ID:-9T2974ST9M}"
          export APP_STORE_CONNECT_ISSUER_ID="${APP_STORE_CONNECT_ISSUER_ID:-c8f0f943-872c-4153-b89a-86fb7cc78b8f}"
          bundle exec fastlane release || {
            echo "Building via xcodebuild and altool fallback..."
            cd ios/App
            xcodebuild -project App.xcodeproj -scheme App -archivePath build/App.xcarchive archive -allowProvisioningUpdates -authenticationKeyID $APP_STORE_CONNECT_KEY_ID -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
            
            cat << 'EOF' > exportOptions.plist
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>method</key>
                <string>app-store</string>
                <key>signingStyle</key>
                <string>automatic</string>
            </dict>
            </plist>
            EOF
            
            xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist exportOptions.plist -exportPath build/ipa -allowProvisioningUpdates -authenticationKeyID $APP_STORE_CONNECT_KEY_ID -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
            
            xcrun altool --upload-app -f build/ipa/App.ipa -t ios --apiKey $APP_STORE_CONNECT_KEY_ID --apiIssuer $APP_STORE_CONNECT_ISSUER_ID
          }

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GenYoga-iOS-v6.42
          path: |
            app ios/build/*.ipa
            app ios/ios/App/build/ipa/*.ipa
          if-no-files-found: ignore
