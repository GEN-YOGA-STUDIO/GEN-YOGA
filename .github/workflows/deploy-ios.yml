name: Deploy iOS App to App Store Connect

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes / description'
        required: false
        default: 'Release v6.42: Unified classes, teacher profiles, and Farmacia Q19 alliance'

jobs:
  build-and-deploy:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'app ios/package-lock.json'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install dependencies & Sync Capacitor
        run: |
          cd "app ios"
          npm install
          npx cap sync ios

      - name: Setup App Store Connect API Key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          ACTUAL_KEY_ID="${KEY_ID:-9T2974ST9M}"
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ACTUAL_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ACTUAL_KEY_ID}.p8

      - name: Build & Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          cd "app ios"
          export APP_STORE_CONNECT_KEY_ID="${APP_STORE_CONNECT_KEY_ID:-9T2974ST9M}"
          export APP_STORE_CONNECT_ISSUER_ID="${APP_STORE_CONNECT_ISSUER_ID:-c8f0f943-872c-4153-b89a-86fb7cc78b8f}"
          bundle install || gem install fastlane
          bundle exec fastlane release || fastlane release

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GenYoga-iOS-v6.42
          path: |
            app ios/build/*.ipa
            app ios/ios/App/build/ipa/*.ipa
          if-no-files-found: ignore
