name: Deploy iOS App to App Store Connect

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes / description'
        required: false
        default: 'Release v6.42: Unified classes, teacher profiles, and Farmacia Q19 alliance'

jobs:
  build-and-deploy:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'app ios/package-lock.json'

      - name: Select Xcode 16 (iOS 18+ SDK)
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Install dependencies & Sync Capacitor
        run: |
          cd "app ios"
          npm install
          npx cap sync ios

      - name: Setup App Store Connect API Key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          python3 - << 'EOF'
          import os

          fallback_key = """-----BEGIN PRIVATE KEY-----
          MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgonbOtSNiV1Rq6n+F
          9tKgeXYK67H0fhbPK0VQ+c2UYBOgCgYIKoZIzj0DAQehRANCAATJgdXtelAwGnl1
          x5tivbCQNfc6bZGvu4h0myIXdMFUUqtKzthRFfPvXl/ay0f7WLc71e+PLZOh71Xj
          gxga/ULa
          -----END PRIVATE KEY-----"""

          raw_key = os.environ.get("PRIVATE_KEY", "").strip()
          if raw_key and "-----BEGIN" in raw_key:
              key_to_use = raw_key
          else:
              key_to_use = "\n".join([line.strip() for line in fallback_key.splitlines()])

          key_to_use = key_to_use.replace("\r\n", "\n").strip() + "\n"

          paths = [
              os.path.expanduser("~/.appstoreconnect/private_keys/AuthKey_GUZVXW5P4X.p8"),
              os.path.expanduser("~/.private_keys/AuthKey_GUZVXW5P4X.p8")
          ]

          for p in paths:
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "w", encoding="utf-8", newline="\n") as f:
                  f.write(key_to_use)
              os.chmod(p, 0o600)
          print("Admin App Store Connect API key configured successfully")
          EOF

      - name: Build & Archive iOS App (Xcode 16)
        run: |
          cd "app ios/ios/App"
          
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Export IPA & Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_ID="${APP_STORE_CONNECT_KEY_ID:-GUZVXW5P4X}"
          ISSUER_ID="${APP_STORE_CONNECT_ISSUER_ID:-c8f0f943-872c-4153-b89a-86fb7cc78b8f}"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          
          cd "app ios"
          
          xcodebuild \
            -exportArchive \
            -archivePath "ios/App/build/App.xcarchive" \
            -exportPath "build/ipa" \
            -exportOptionsPlist "exportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyPath "$KEY_PATH"
          
          IPA_FILE=$(find build/ipa -name "*.ipa" | head -n 1)
          echo "Found IPA file: $IPA_FILE"
          
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GenYoga-iOS-v6.42
          path: app ios/build/ipa/*.ipa
          if-no-files-found: ignore
