name: Build Android AAB (+ Play)

# Distribución Android automatizada: compila el AAB firmado y,
# si existe el secreto PLAY_SERVICE_ACCOUNT_JSON, lo sube a Play Console.
# Lanzado manual o con: gh workflow run deploy-android --ref main
# O desde local: node scripts/ship.mjs <version> --upload-android
#
# Secretos (crear UNA vez en repo → Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_PASSWORD   → contraseña del release-key.jks (ya puesta)
#   ANDROID_KEY_PASSWORD        → contraseña de la clave yoga-key (ya puesta)
#   PLAY_SERVICE_ACCOUNT_JSON   → JSON de la service account de Play Console
#       (Play Console → Configuración → Acceso a la API → crear/ vincular
#        cuenta de servicio con permiso "Publicar en testing"; SOLO esto es manual)

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Canal de Play (internal recomendado)'
        required: false
        default: 'internal'
        type: choice
        options: [internal, alpha, beta, production]

jobs:
  validate:
    name: Puerta de calidad (checks bloqueantes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias y sincronizar Capacitor
        run: |
          npm ci --prefix "app android" --no-audit --no-fund
          npm ci --prefix "app ios" --no-audit --no-fund
          npx --prefix "app android" cap sync android
          npx --prefix "app ios" cap sync ios
      - name: Batería completa de checks
        run: npm test

  build:
    name: AAB firmado
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias y sincronizar Capacitor
        run: |
          npm ci --prefix "app android" --no-audit --no-fund
          npx --prefix "app android" cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Compilar AAB firmado
        working-directory: app android/android
        env:
          GENYOGA_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GENYOGA_KEY_ALIAS: yoga-key
          GENYOGA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Subir AAB como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GenYoga-android-aab
          path: app android/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  play:
    name: Subida a Play Console
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar AAB
        uses: actions/download-artifact@v4
        with:
          name: GenYoga-android-aab
          path: dist
      - name: Comprobar secreto de Play
        id: gate
        run: |
          if [ -z "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "⛔ Falta el secreto PLAY_SERVICE_ACCOUNT_JSON."
            echo "Créalo una vez en Play Console → Configuración → Acceso a la API"
            echo "(service account con permiso de publicar en testing) y pégalo en repo → Settings → Secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Subir al canal
        if: steps.gate.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.genyoga.app
          releaseFiles: dist/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
