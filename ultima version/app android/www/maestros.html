            .teachers-hero__title-line--green {

                background-image: linear-gradient(180deg, #7b4526 0%, #946f34 100%);

                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .teachers-hero__portrait {

                z-index: 2;
                display: block;
                height: auto;
                object-fit: contain;
                pointer-events: none;
                user-select: none;
                mix-blend-mode: normal;
            }

            .teacher-card__portrait {
                position: relative;
                z-index: 2;
                display: block;
                max-width: 100%;
                max-height: 100%;
                width: auto;
                height: auto;
                object-fit: contain;
                mix-blend-mode: normal;

                transform: scale(1.045);

            .teachers-hero__portrait--left-top {
                z-index: 2;

                width: clamp(210px, 15vw, 280px);

            .teachers-hero__portrait--left-bottom {
                z-index: 3;
                bottom: -1%;

                width: clamp(300px, 21.5vw, 405px);
            }

            .teachers-hero__portrait--right-top {
                z-index: 2;
                top: clamp(54px, 9vh, 88px);
                right: clamp(54px, 4vw, 84px);
                width: clamp(230px, 16vw, 300px);
            }

            .teachers-hero__portrait--right-bottom {
                z-index: 3;
                right: clamp(18px, 1.8vw, 38px);
                bottom: -1%;
                width: clamp(230px, 16vw, 300px);
            }

            .teachers-hero__doodle {
                position: absolute;
                z-index: 1;
                width: min(29vw, 500px);
                height: auto;
                overflow: visible;
                pointer-events: none;
                opacity: 0.72;
                filter: blur(1.5px);
            }

            .teachers-hero__doodle path {
                fill: none;
                stroke: currentColor;
                stroke-linecap: round;
                stroke-linejoin: round;

            .teachers-hero__doodle--left {
                top: -8%;

                color: var(--masters-orange-dark);
                transform: rotate(-9deg);
            }

            .teachers-hero__doodle--right {

                right: -4%;
                color: #b48b4c;
                transform: rotate(10deg);
            }

            .teachers-hero__home {
                position: absolute;
                z-index: 8;
                top: clamp(18px, 3vw, 42px);
                left: clamp(18px, 3.5vw, 58px);

                gap: 0.6rem;
                padding: 0.72rem 1.05rem;
                border: 1px solid rgba(106, 101, 64, 0.24);
                border-radius: 999px;
                color: var(--masters-green);
                background: rgba(248, 246, 242, 0.82);
                box-shadow: 0 8px 28px rgba(38, 22, 12, 0.08);
                font-size: 0.72rem;
                font-weight: 700;

                gap: 0.15rem;
                color: var(--masters-green);
                font-size: 0.65rem;

            .teachers-hero__scroll i {
                font-size: 1.6rem;
                animation: masters-bob 1.8s ease-in-out infinite;
            }

            .teachers-gallery {
                position: relative;
                display: flex;
                flex-direction: column;
                width: 100%;
                min-height: 100vh;
                min-height: 100svh;
                padding: clamp(34px, 5.2vh, 58px) clamp(24px, 1.35vw, 30px) clamp(58px, 7vh, 86px);

                background: var(--masters-ivory);
                border-top: 1px solid rgba(216, 90, 56, 0.08);
            }

            .teachers-gallery__home {
                align-self: flex-start;

                justify-content: center;

                padding: 0.95rem 2rem;
                border-radius: 999px;
                color: #ffffff;
                background: linear-gradient(90deg, #b45c47 0%, #8f4b38 100%);
                box-shadow: 0 8px 24px rgba(38, 22, 12, 0.18);
                font-size: clamp(1.35rem, 2vw, 2.1rem);

                letter-spacing: 0.03em;

            }

            .teachers-gallery__filters {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: clamp(14px, 1.35vw, 26px);
                width: min(80vw, 1515px);
                margin: clamp(76px, 10vh, 108px) auto 0;
            }

            .teacher-filter {
                min-width: 0;
                padding: clamp(0.72rem, 1.35vh, 1rem) clamp(1rem, 1.8vw, 2.2rem);
                border: 0;
                border-radius: 999px;
                color: #26160c;
                font-family: 'Montserrat Arabic', sans-serif;
                font-size: clamp(1.2rem, 2.1vw, 2.55rem);
                font-weight: 700;
                line-height: 1.15;
                text-align: center;
                text-decoration: none;
                text-transform: uppercase;
                white-space: nowrap;
                cursor: pointer;
                opacity: 0.88;
                transition: transform 180ms ease, filter 180ms ease, color 180ms ease, opacity 180ms ease, box-shadow 180ms ease;
            }

            .teacher-filter:hover,
            .teacher-filter:focus-visible {
                color: #26160c;
                opacity: 1;
                filter: saturate(1.1);
                transform: translateY(-2px);
                outline: none;
            }

            .teacher-filter--todos { background: linear-gradient(90deg, #e89582 0%, #f3dcd2 100%); }
            .teacher-filter--clases { background: linear-gradient(90deg, #cbbaa9 0%, #dfd4c5 100%); }
            .teacher-filter--consultas { background: linear-gradient(90deg, #d4c2a3 0%, #eae1bf 100%); }
            .teacher-filter--talleres { background: linear-gradient(90deg, #c9c7a5 0%, #e2e1c7 100%); }

            .teacher-filter.is-active {
                color: #ffffff !important;
                opacity: 1;
                text-decoration: none;
                box-shadow: 0 8px 24px rgba(38, 22, 12, 0.22);
            }

            .teacher-filter.is-active:hover,
            .teacher-filter.is-active:focus-visible {
                color: #ffffff !important;
            }

            .teacher-filter--todos.is-active { background: linear-gradient(90deg, #b45c47 0%, #8f4b38 100%); }
            .teacher-filter--clases.is-active { background: linear-gradient(90deg, #795244 0%, #5d3b2f 100%); }
            .teacher-filter--consultas.is-active { background: linear-gradient(90deg, #916a32 0%, #6e4e20 100%); }
            .teacher-filter--talleres.is-active { background: linear-gradient(90deg, #6a6540 0%, #4c482b 100%); }

            .teachers-gallery__grid {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                align-items: start;
                gap: clamp(18px, 1.7vw, 34px);
                width: 100%;
                max-width: 1840px;
                margin: clamp(70px, 9.5vh, 112px) auto 0;
            }

            .teachers-gallery__grid--1 { max-width: 450px; grid-template-columns: minmax(0, 1fr); }
            .teachers-gallery__grid--2 { max-width: 920px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .teachers-gallery__grid--3 { max-width: 1380px; grid-template-columns: repeat(3, minmax(0, 1fr)); }

            .teacher-card {
                position: relative;
                min-width: 0;
                color: #1b100b;
                text-align: left;
                transition: transform 250ms ease;
            }

            .teacher-card:hover,
            .teacher-card:focus-within {
                transform: translateY(-6px);
            }

            .teacher-card__trigger {
                display: block;
                width: 100%;
                padding: 0;
                border: 0;
                border-radius: 18px;
                color: inherit;
                background: transparent;
                text-align: inherit;
                text-decoration: none;
                cursor: pointer;
            }

            .teacher-card__trigger:focus-visible {
                outline: 3px solid rgba(180, 92, 71, 0.72);
                outline-offset: 7px;
            }

            .teacher-card__figure {
                position: relative;
                display: flex;
                align-items: flex-start;
                justify-content: center;
                width: 100%;
                height: clamp(300px, 41vh, 445px);
                margin-bottom: 0.3rem;
            }

            .teacher-card__name {
                position: relative;
                z-index: 3;
                margin: 0;
                font-family: 'Montserrat Arabic', sans-serif;
                font-size: clamp(1.55rem, 2.05vw, 2.55rem);
                font-weight: 700;
                letter-spacing: 0.015em;
                line-height: 1.02;
                text-transform: uppercase;
            }

            .teacher-card__specialty {
                position: relative;
                z-index: 3;
                margin: 0.2rem 0 0;
                font-family: 'Montserrat Arabic', sans-serif;
                font-size: clamp(0.98rem, 1.2vw, 1.5rem);
                font-weight: 400;
                line-height: 1.18;
            }

            .teacher-card__soon {
                position: relative;
                z-index: 3;
                display: inline-block;
                margin: 0.55rem 0 0;
                padding: 0.3rem 0.75rem;
                border: 1px solid rgba(155, 123, 55, 0.35);
                border-radius: 999px;
                background-color: rgba(155, 123, 55, 0.12);
                color: #7a5f2a;
                font-family: 'Montserrat Arabic', sans-serif;
                font-size: 0.72rem;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            .teacher-class-links {
                position: relative;
                z-index: 4;
                margin-top: 0.9rem;
                font-family: 'Montserrat Arabic', Montserrat, sans-serif;
            }

            .teacher-class-links__label {
                margin: 0 0 0.45rem;
                color: rgba(38, 22, 12, 0.58);
                font-size: 0.68rem;
                font-weight: 800;
                letter-spacing: 0.08em;
                line-height: 1.2;
                text-transform: uppercase;
            }

            .teacher-class-links__list {
                display: flex;
                flex-wrap: wrap;
                gap: 0.42rem;
                margin: 0;
                padding: 0;
                list-style: none;
            }

            .teacher-class-link {
                display: inline-flex;
                align-items: center;
                gap: 0.28rem;
                min-height: 38px;
                padding: 0.42rem 0.68rem;
                border: 1px solid rgba(145, 106, 50, 0.24);
                border-radius: 999px;
                color: #6e4e20;
                background: rgba(234, 225, 191, 0.5);
                font-size: 0.73rem;
                font-weight: 750;
                line-height: 1.1;
                text-decoration: none;
                transition: color 160ms ease, background 160ms ease, border-color 160ms ease, transform 160ms ease;
            }

            .teacher-class-link:hover,
            .teacher-class-link:focus-visible {
                color: #ffffff;
                background: #916a32;
                border-color: #916a32;
                outline: none;
                transform: translateY(-1px);
            }

            .teacher-class-link i {
                flex: 0 0 auto;
                font-size: 0.9rem;
            }

            .teacher-class-links--modal {
                margin-top: 0;
            }

            .teacher-class-links--modal .teacher-class-links__label {
                color: rgba(255, 255, 255, 0.78);
            }

            .teacher-class-links--modal .teacher-class-link {
                color: #ffffff;
                background: rgba(255, 255, 255, 0.12);
                border-color: rgba(255, 255, 255, 0.28);
            }

            .teacher-class-links--modal .teacher-class-link:hover,
            .teacher-class-links--modal .teacher-class-link:focus-visible {
                color: #9b572c;
                background: #ffffff;
                border-color: #ffffff;
            }

            body.teacher-modal-open {
                overflow: hidden;
            }

            .teacher-modal-overlay {
                position: fixed;
                inset: 0;
                z-index: 10000;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: clamp(12px, 3vw, 36px);
                background: rgba(248, 246, 242, 0.48);
                opacity: 0;
                visibility: hidden;
                backdrop-filter: blur(12px) saturate(0.72);
                transition: opacity 220ms ease, visibility 220ms ease;
            }

            .teacher-modal-overlay.is-hidden {
                display: none;
            }

            .teacher-modal-overlay.is-open {
                opacity: 1;
                visibility: visible;
            }

            .teacher-modal {
                position: relative;
                width: min(980px, calc(100vw - 32px));
                max-height: calc(100svh - 32px);
                overflow: hidden;
                border: 1px solid rgba(255, 255, 255, 0.16);
                border-radius: clamp(24px, 2.4vw, 32px);
                color: #fff;
                background: linear-gradient(120deg, #e66a54 0%, #dc662b 57%, #af7a34 100%);
                box-shadow: 0 28px 70px rgba(74, 40, 17, 0.28);
                transform: translateY(12px) scale(0.985);
                transition: transform 220ms ease;
            }

            .teacher-modal-overlay.is-open .teacher-modal {
                transform: translateY(0) scale(1);
            }

            .teacher-modal__close {
                position: absolute;
                z-index: 5;
                top: 15px;
                right: 16px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 38px;
                height: 38px;
                padding: 0;
                border: 1px solid rgba(255, 255, 255, 0.24);
                border-radius: 999px;
                color: #fff;
                background: rgba(255, 255, 255, 0.1);
                font-size: 1.15rem;
                cursor: pointer;
                transition: color 160ms ease, background 160ms ease, transform 160ms ease;
            }

            .teacher-modal__close:hover,
            .teacher-modal__close:focus-visible {
                color: #9b572c;
                background: #fff;
                outline: none;
                transform: rotate(4deg);
            }

            .teacher-modal__body {
                max-height: calc(100svh - 32px);
            }

            .teacher-modal__layout {
                display: grid;
                grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
                height: min(680px, calc(100svh - 32px));
                min-height: 440px;
                font-family: 'Montserrat Arabic', Montserrat, sans-serif;
            }

            .teacher-modal__profile {
                position: relative;
                display: grid;
                grid-template-rows: auto minmax(220px, 1fr) auto;
                min-width: 0;
                padding: 28px 24px 22px clamp(30px, 4vw, 48px);
            }

            .teacher-modal__identity {
                position: relative;
                z-index: 2;
                padding-right: 6px;
            }

            .teacher-modal__name {
                margin: 0;
                font-size: clamp(1.65rem, 2.5vw, 2.15rem);
                font-weight: 800;
                letter-spacing: 0.01em;
                line-height: 0.98;
                text-transform: uppercase;
            }

            .teacher-modal__specialty {
                max-width: 390px;
                margin: 0.35rem 0 0;
                font-size: clamp(0.78rem, 1.25vw, 0.98rem);
                font-weight: 700;
                line-height: 1.18;
            }

            .teacher-modal__portrait-stage {
                display: flex;
                align-items: flex-end;
                justify-content: center;
                min-height: 0;
                overflow: hidden;
            }

            .teacher-modal__portrait {
                display: block;
                width: min(100%, 370px);
                max-height: 285px;
                object-fit: contain;
                object-position: center bottom;
            }

            .teacher-modal__quote {
                position: relative;
                z-index: 2;
                max-width: 360px;
                margin: 0.35rem 0 0;
                font-size: 0.74rem;
                font-weight: 700;
                line-height: 1.25;
            }

            .teacher-modal__details {
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                gap: clamp(11px, 1.6vh, 17px);
                min-width: 0;
                padding: 34px clamp(42px, 4.4vw, 58px) 30px 20px;
                overflow-y: auto;
                overscroll-behavior: contain;
                scrollbar-gutter: stable;
            }

            .teacher-modal__section {
                min-width: 0;
            }

            .teacher-modal__section-title,
            .teacher-modal__location {
                display: flex;
                align-items: center;
                gap: 0.38rem;
                margin: 0 0 0.32rem;
                color: #fff;
                font-size: 0.74rem;
                font-weight: 800;
                letter-spacing: 0.015em;
                line-height: 1.1;
                text-transform: uppercase;
            }

            .teacher-modal__section-title i,
            .teacher-modal__location i {
                flex: 0 0 auto;

            .teacher-modal__section-title {

                font-size: 0.82rem;
                font-weight: 700;
                letter-spacing: 0.025em;
            }

            .teacher-modal__section-text {

                font-size: clamp(0.69rem, 1.02vw, 0.79rem);

                font-weight: 300;
                line-height: 1.4;
            }

            .teacher-modal__section-copy {
                display: grid;
                gap: 0.42rem;
            }

            .teacher-modal__meta {
                display: flex;
                flex-wrap: wrap;
                gap: 0.65rem 1.15rem;
                padding-top: 0.1rem;
            }

            .teacher-modal__location {
                margin: 0;
            }

            .teacher-modal__location span {
                line-height: 1.2;
            }

            @media (max-width: 700px) {
                .teacher-modal-overlay {
                    align-items: center;
                    padding: 8px;
                }

                .teacher-modal {
                    width: calc(100vw - 16px);
                    max-height: calc(100svh - 16px);
                    border-radius: 22px;
                }

                .teacher-modal__body {
                    max-height: calc(100svh - 16px);
                    overflow-y: auto;
                    overscroll-behavior: contain;
                }

                .teacher-modal__close {
                    top: 12px;
                    right: 12px;
                    width: 34px;
                    height: 34px;
                }

                .teacher-modal__layout {
                    grid-template-columns: minmax(0, 1fr);
                    grid-template-rows: minmax(210px, 31svh) auto;
                    height: auto;
                    min-height: 0;
                }

                .teacher-modal__profile {
                    grid-template-rows: auto 1fr auto;
                    min-height: 210px;
                    padding: 22px 18px 12px;
                    overflow: hidden;
                }

                .teacher-modal__identity,
                .teacher-modal__quote {
                    width: 58%;
                }

                .teacher-modal__name {
                    font-size: clamp(1.25rem, 6.4vw, 1.7rem);
                }

                .teacher-modal__specialty {
                    font-size: 0.68rem;
                }

                .teacher-modal__portrait-stage {
                    position: absolute;
                    right: 2px;
                    bottom: 0;
                    width: 48%;
                    height: 88%;

        ];

        function getEspecialidadTexto(especialidad) {
            if (!especialidad) return '';
            return especialidad.split('|')[0].trim();
        }

        function getEspecialidadCategorias(p) {
            if (!p) return [];
            const especialidad = p.especialidad || '';
            const email = (p.email || '').toLowerCase();
            const nombre = (p.nombre || '').toLowerCase();

            if (email.includes('yanira') || nombre.includes('yanira')) return ['clases', 'talleres'];
            if (email.includes('miriam') || email.includes('respira') || nombre.includes('miriam')) return ['consultas'];
            if (email.includes('silvia') || email.includes('sil-hada') || nombre.includes('silvia')) return ['clases', 'consultas'];
            if (email.includes('isabel') || email.includes('isarodriguez') || nombre.includes('isabel')) return ['consultas'];
            if (email.includes('angel') || nombre.includes('ángel') || nombre.includes('angel')) return ['clases'];

            const parts = especialidad.split('|');
            if (parts.length > 1) {
                return parts[1].split(',').map(c => c.trim().toLowerCase());
            }

            const esp = especialidad.toLowerCase();
            const cats = [];
            if (esp.includes('yoga') || esp.includes('clase') || esp.includes('vinyasa') || esp.includes('hatha')) cats.push('clases');
            if (esp.includes('consulta') || esp.includes('psico') || esp.includes('nutri') || esp.includes('pni') || esp.includes('ayurveda')) cats.push('consultas');
            if (esp.includes('taller') || esp.includes('workshop')) cats.push('talleres');
            return cats;
        }

        function getTeacherKey(p) {
            const sharedKey = window.GENTeacherProfiles?.getKey?.(p);
            if (sharedKey) return sharedKey;

            const identity = `${p?.nombre || ''} ${p?.apellidos || ''} ${p?.email || ''}`.toLowerCase();
            if (identity.includes('yanira')) return 'yanira';
            if (identity.includes('miriam')) return 'miriam';
            if (identity.includes('silvia')) return 'silvia';
            if (identity.includes('isabel')) return 'isabel';
            if (identity.includes('ángel') || identity.includes('angel')) return 'angel';
            return '';
        }

        function getTeacherSlug(p) {
            const sharedSlug = window.GENTeacherProfiles?.getSlug?.(p);
            if (sharedSlug) return sharedSlug;

            const numericId = Number(p?.id);
            if (Number.isSafeInteger(numericId) && numericId > 0) {
                return `profesor-${numericId}`;
            }

            return '';
        }

        function getPublicSlug(value) {
            if (window.GENTeacherProfiles?.slugify) {
                return window.GENTeacherProfiles.slugify(value);
            }

            return String(value || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/&/g, ' y ')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '')
                .slice(0, 80)
                .replace(/-+$/g, '');
        }

        function getPublicClassDisplayName(value) {
            const original = String(value || '').trim();
            const normalized = original
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/\s+/g, ' ');
            if (normalized === 'yoga aryuveda') return 'Yoga Ayurveda';
            if (normalized === 'yoga (silvia) consultas') return 'Yoga con Silvia';
            return original;
        }

        function getUpcomingClassesForTeacher(prof) {
            const teacherId = String(prof?.id ?? '');
            if (!teacherId) return [];
            return upcomingClassesByTeacher.get(teacherId) || [];
        }

        function formatUpcomingClassDate(fechaInicio) {
            const date = new Date(fechaInicio);
            if (Number.isNaN(date.getTime())) return '';

            const locale = window.currentLang === 'en' ? 'en-GB' : 'es-ES';
            return new Intl.DateTimeFormat(locale, {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                hour: '2-digit',
                minute: '2-digit',
                timeZone: 'Europe/Madrid'
            }).format(date);
        }

        function buildCalendarClassHref(prof, clase) {
            const teacherSlug = getTeacherSlug(prof);
            const styleSlug = clase?.styleSlug || getPublicSlug(clase?.nombre);
            const classId = Number(clase?.id);
            if (!teacherSlug || !styleSlug || !Number.isSafeInteger(classId) || classId <= 0) return '';

            const params = new URLSearchParams({
                class: String(classId),
                teacher: teacherSlug,
                style: styleSlug
            });
            return `clases.html?${params.toString()}#calendario-publico`;
        }

        function renderTeacherClassLinks(prof, context = 'card') {
            const classes = getUpcomingClassesForTeacher(prof);
            if (!classes.length) return '';

            const teacherName = prof?.nombre || 'GEN Yoga';
            const contextClass = context === 'modal' ? ' teacher-class-links--modal' : '';
            const links = classes.map(clase => {
                const href = buildCalendarClassHref(prof, clase);
                if (!href) return '';

                const className = getPublicClassDisplayName(clase.nombre)
                    || (window.currentLang === 'en' ? 'Yoga class' : 'Clase de yoga');
                const dateText = formatUpcomingClassDate(clase.fecha_inicio);
                const relation = window.currentLang === 'en' ? 'with' : 'con';
                const ariaLabel = `${t('teachers_view_next_class')} ${className} ${relation} ${teacherName}${dateText ? `: ${dateText}` : ''}`;

                return `
                    <li>
                        <a class="teacher-class-link" href="${escapeHtmlPublic(href)}" aria-label="${escapeHtmlPublic(ariaLabel)}" title="${escapeHtmlPublic(ariaLabel)}">
                            <span>${escapeHtmlPublic(className)}</span>
                            <i class="ph-bold ph-arrow-up-right" aria-hidden="true"></i>
                        </a>
                    </li>
                `;
            }).filter(Boolean).join('');

            if (!links) return '';

            const navLabel = `${t('teachers_class_links_label')} ${teacherName}`;
            return `
                <nav class="teacher-class-links${contextClass}" aria-label="${escapeHtmlPublic(navLabel)}">
                    <p class="teacher-class-links__label">${escapeHtmlPublic(t('teachers_upcoming_classes'))}</p>
                    <ul class="teacher-class-links__list">
                        ${links}
                    </ul>
                </nav>
            `;
        }

        async function fetchUpcomingClassesLanding() {
            upcomingClassesByTeacher = new Map();
            if (!client) return;

            try {
                const nowIso = new Date().toISOString();
                const { data: classes, error } = await client
                    .from('clases')
                    .select('id,nombre,fecha_inicio,profesor_id,profesionales!inner(visible_publico)')
                    .in('tipo_clase', ['yoga', 'taller'])
                    .eq('activa', true)
                    .eq('profesionales.visible_publico', true)
                    .gte('fecha_inicio', nowIso)
                    .order('fecha_inicio', { ascending: true })
                    .limit(500);

                if (error) throw error;

                const nextByTeacherAndStyle = new Map();
                (classes || []).forEach(clase => {
                    const classId = Number(clase?.id);
                    const teacherId = String(clase?.profesor_id ?? '');
                    const styleSlug = getPublicSlug(clase?.nombre);
                    const startDate = new Date(clase?.fecha_inicio);
                    if (
                        !Number.isSafeInteger(classId)
                        || classId <= 0
                        || !teacherId
                        || !styleSlug
                        || Number.isNaN(startDate.getTime())
                    ) {
                        return;
                    }

                    const groupKey = `${teacherId}:${styleSlug}`;
                    if (!nextByTeacherAndStyle.has(groupKey)) {
                        nextByTeacherAndStyle.set(groupKey, {
                            id: classId,
                            nombre: String(clase.nombre || ''),
                            fecha_inicio: clase.fecha_inicio,
                            profesor_id: clase.profesor_id,
                            styleSlug
                        });
                    }
                });

                nextByTeacherAndStyle.forEach(clase => {
                    const teacherId = String(clase.profesor_id);
                    const teacherClasses = upcomingClassesByTeacher.get(teacherId) || [];
                    teacherClasses.push(clase);
                    upcomingClassesByTeacher.set(teacherId, teacherClasses);
                });
            } catch (error) {
                console.error('No se pudieron cargar las próximas clases públicas:', error);
                upcomingClassesByTeacher = new Map();
            }
        }

        function getRequestedTeacherSlug() {
            const rawSlug = new URLSearchParams(window.location.search).get('teacher') || '';
            if (!rawSlug) return '';

            const publicSlugs = window.GENTeacherProfiles?.publicSlugs;
            const directSlug = publicSlugs && Object.prototype.hasOwnProperty.call(publicSlugs, rawSlug)
                ? publicSlugs[rawSlug]
                : '';
            return directSlug || getPublicSlug(rawSlug);
        }

        function getTeacherBySlug(slug) {
            if (!slug) return null;
            return allProfesionalesLanding.find(prof => getTeacherSlug(prof) === slug) || null;
        }

        function categoryShowsTeacher(category, prof) {
            const selectedCategory = category === 'nutricion' ? 'talleres' : category;
            if (!selectedCategory || selectedCategory === 'todos') return true;

            const categories = getEspecialidadCategorias(prof);
            if (selectedCategory === 'yoga') return categories.includes('clases');
            if (selectedCategory === 'psicologia') return categories.includes('consultas');
            if (selectedCategory === 'talleres') return categories.includes('talleres');
            return false;
        }

        function buildTeacherProfileHref(prof) {
            const teacherSlug = getTeacherSlug(prof);
            if (!teacherSlug) return 'maestros.html#maestros-grid-section';

            const params = new URLSearchParams(window.location.search);
            params.set('teacher', teacherSlug);
            return `maestros.html?${params.toString()}#teacher-${teacherSlug}`;
        }

        function updateTeacherUrl(teacherSlug) {
            try {
                const url = new URL(window.location.href);
                if (teacherSlug) {
                    url.searchParams.set('teacher', teacherSlug);
                    url.hash = `teacher-${teacherSlug}`;
                } else {
                    url.searchParams.delete('teacher');
                    if (url.hash.startsWith('#teacher-')) {
                        url.hash = 'maestros-grid-section';
                    }
                }
                window.history.replaceState(window.history.state, '', url);
            } catch (error) {
                console.warn('No se pudo sincronizar la ficha del maestro con la URL:', error);
            }
        }

        function openRequestedTeacherFromUrl() {
            const requestedSlug = getRequestedTeacherSlug();
            if (!requestedSlug) return;

            const prof = getTeacherBySlug(requestedSlug);
            const card = document.getElementById(`teacher-${requestedSlug}`);
            const trigger = card?.querySelector('.teacher-card__trigger') || null;
            if (!prof || !trigger) return;

            const overlay = document.getElementById('teacher-modal-overlay');
            const shouldScroll = !overlay || overlay.classList.contains('is-hidden');
            if (shouldScroll) {
                card.scrollIntoView({ block: 'center', behavior: 'auto' });
            }
            openTeacherModal(prof, { trigger, syncUrl: false });
        }

        async function fetchProfesionalesLanding() {
            const container = document.getElementById('landing-profesores-container');
            if (!container) return;

            if (!cachedDbProfesionales) {
                if (client) {
                    try {
                        const { data: profesionales, error } = await client
                            .from('profesionales')
                            .select('id,nombre,apellidos,especialidad,descripcion,foto_url,color,visible_publico')
                            .eq('visible_publico', true)
                            .order('nombre');

                        if (error || !profesionales || profesionales.length === 0) {
                            if (error) console.error('Error fetching professionals:', error);
                            cachedDbProfesionales = fallbackProfesionales;
                            profesionalesDbLoaded = false;
                        } else {
                            cachedDbProfesionales = profesionales;
                            profesionalesDbLoaded = true;
                        }
                    } catch (err) {
                        console.error('Exception fetching professionals:', err);
                        cachedDbProfesionales = fallbackProfesionales;
                        profesionalesDbLoaded = false;
                    }
                } else {
                    cachedDbProfesionales = fallbackProfesionales;
                    profesionalesDbLoaded = false;
                }
            }

            const fallbackByKey = new Map(fallbackProfesionales.map(p => [getTeacherKey(p), p]));
            const orderedKeys = ['angel', 'miriam', 'silvia', 'isabel', 'yanira'];
            let profesionalesVisibles;
            if (profesionalesDbLoaded) {
                const visibleRows = cachedDbProfesionales.filter(p => p.visible_publico !== false);
                const databaseByKey = new Map(
                    visibleRows
                        .filter(p => getTeacherKey(p))
                        .map(p => [getTeacherKey(p), p])
                );
                const knownTeachers = orderedKeys
                    .filter(key => databaseByKey.has(key))
                    .map(key => ({ ...fallbackByKey.get(key), ...databaseByKey.get(key) }));
                const additionalTeachers = visibleRows.filter(p => !getTeacherKey(p));
                profesionalesVisibles = [...knownTeachers, ...additionalTeachers];
            } else {
                profesionalesVisibles = orderedKeys.map(key => ({ ...fallbackByKey.get(key) }));
            }
            const translatedProfs = profesionalesVisibles.map(p => {
                const repaired = window.GENTeacherProfiles?.repairLegacyDescription(p) || p;
                return window.translateProfessional ? window.translateProfessional(repaired) : repaired;
            });

            allProfesionalesLanding = translatedProfs.map(p => {
                const emailLower = (p.email || '').toLowerCase();
                const nomLower = (p.nombre || '').toLowerCase();

                const updated = { ...p };
                if (emailLower.includes('angel') || nomLower.includes('ángel') || nomLower.includes('angel')) {
                    updated.nombre = "ÁNGEL JAVIER";
                    updated.foto_cutout = 'img/maestro-angel-recortado.webp';
                    updated.especialidad = 'Yoga para hombres & Yoga para Todos | clases';
                } else if (emailLower.includes('miriam') || emailLower.includes('respira') || nomLower.includes('miriam')) {
                    updated.nombre = "MIRIAM";
                    updated.foto_cutout = 'img/maestra-miriam-recortada.webp';
                    updated.especialidad = 'Psicoterapia, Nutrición y Talleres | consultas';
                } else if (emailLower.includes('silvia') || emailLower.includes('sil-hada') || nomLower.includes('silvia')) {
                    updated.nombre = "SILVIA";
                    updated.foto_cutout = 'img/maestra-silvia-recortada.webp';
                    updated.especialidad = 'Hatha & Iyengar Yoga, Ayurveda | clases,consultas';
                } else if (emailLower.includes('isabel') || emailLower.includes('isarodriguez') || nomLower.includes('isabel')) {
                    updated.nombre = "ISABEL";
                    updated.foto_cutout = 'img/maestra-isabel-recortada.webp';
                    updated.especialidad = 'Psiconeuroinmunología Clínica (PNI) | consultas';
                } else if (emailLower.includes('yanira') || nomLower.includes('yanira')) {
                    updated.nombre = "YANIRA";
                    updated.foto_cutout = 'img/maestra-yanira-recortada.webp';
                    updated.especialidad = 'Power Vinyasa & Yoga Restaurativo | clases,talleres';
                }
                return updated;
            });

            await fetchUpcomingClassesLanding();

            const urlParams = new URLSearchParams(window.location.search);
            const requestedTeacher = getTeacherBySlug(getRequestedTeacherSlug());
            const requestedCategory = urlParams.get('cat') || 'todos';
            const catParam = requestedTeacher && !categoryShowsTeacher(requestedCategory, requestedTeacher)
                ? 'todos'
                : requestedCategory;
            filtrarProfesionalesLanding(catParam);
            requestAnimationFrame(openRequestedTeacherFromUrl);
        }

        window.filtrarProfesionalesLanding = function(category) {
            const selectedCategory = category === 'nutricion' ? 'talleres' : category;

            const btnTodos = document.getElementById('btn-filtro-prof-todos');
            const btnYoga = document.getElementById('btn-filtro-prof-yoga');
            const btnPsy = document.getElementById('btn-filtro-prof-psicologia');
            const btnTalleres = document.getElementById('btn-filtro-prof-talleres');
            const activeButton = {
                todos: btnTodos,
                yoga: btnYoga,
                psicologia: btnPsy,
                talleres: btnTalleres
            }[selectedCategory];

            [btnTodos, btnYoga, btnPsy, btnTalleres].filter(Boolean).forEach(button => {
                const isActive = button === activeButton;
                button.classList.toggle('is-active', isActive);
                button.setAttribute('aria-pressed', String(isActive));
            });

            let filtrados = allProfesionalesLanding;
            if (selectedCategory === 'todos') {
                filtrados = allProfesionalesLanding.filter(p => {
                    const cats = getEspecialidadCategorias(p);
                    return cats.length === 0 || cats.includes('clases') || cats.includes('consultas') || cats.includes('talleres');
                });
            } else if (selectedCategory === 'yoga') {
                filtrados = allProfesionalesLanding.filter(p => getEspecialidadCategorias(p).includes('clases'));
            } else if (selectedCategory === 'psicologia') {
                filtrados = allProfesionalesLanding.filter(p => getEspecialidadCategorias(p).includes('consultas'));
            } else if (selectedCategory === 'talleres') {
                filtrados = allProfesionalesLanding.filter(p => getEspecialidadCategorias(p).includes('talleres'));
            }

            renderProfesionalesLanding(filtrados);
        }

        function getTeacherPhoto(nombre) {
            const n = (nombre || '').toLowerCase();
            if (n.includes('ángel') || n.includes('angel')) return 'img/maestro-angel-recortado.webp';
            if (n.includes('miriam')) return 'img/maestra-miriam-recortada.webp';
            if (n.includes('yanira')) return 'img/maestra-yanira-recortada.webp';
            if (n.includes('isabel')) return 'img/maestra-isabel-recortada.webp';
            return 'img/maestra-silvia-recortada.webp';
        }

        function getTeacherCutoutPhoto(nombre) {
            const n = (nombre || '').toLowerCase();
            if (n.includes('ángel') || n.includes('angel')) return 'img/maestro-angel-recortado.webp';
            if (n.includes('miriam')) return 'img/maestra-miriam-recortada.webp';
            if (n.includes('yanira')) return 'img/maestra-yanira-recortada.webp';
            if (n.includes('isabel')) return 'img/maestra-isabel-recortada.webp';
            return 'img/maestra-silvia-recortada.webp';
        }

        function renderProfesionalesLanding(profesionales) {
            const container = document.getElementById('landing-profesores-container');
            if (!container) return;
            container.innerHTML = '';

            if (!profesionales || profesionales.length === 0) {
                container.className = 'teachers-gallery__grid teachers-gallery__grid--1';
                container.innerHTML = `<div class="text-center text-[#744833]/70 italic py-10 font-bold" data-i18n="teachers_no_category">
                    ${t('teachers_no_category')}
                </div>`;
                return;
            }

            container.className = `teachers-gallery__grid teachers-gallery__grid--${Math.min(profesionales.length, 4)}`;

            profesionales.forEach((prof, index) => {
                const nombre = prof.nombre || 'PROFESOR';
                const especialidadTexto = getEspecialidadTexto(prof.especialidad) || t('teachers_fallback_spec');
                const doodlesSvg = getTeacherDoodlesSvg(nombre);
                const photoUrl = prof.foto_cutout || getTeacherPhoto(nombre);
                const teacherSlug = getTeacherSlug(prof);
                const profileHref = buildTeacherProfileHref(prof);
                const portraitAlt = window.currentLang === 'en'
                    ? `Black-and-white portrait of ${nombre}`
                    : `Retrato en blanco y negro de ${nombre}`;

                const card = document.createElement('article');
                card.className = 'teacher-card group';
                if (teacherSlug) card.id = `teacher-${teacherSlug}`;

                card.innerHTML = `
                    <a class="teacher-card__trigger" href="${escapeHtmlPublic(profileHref)}" aria-label="${escapeHtmlPublic(`${t('teachers_view_card')} ${nombre}`)}">
                        <div class="teacher-card__figure">
                            ${doodlesSvg}
                            <img src="${escapeHtmlPublic(photoUrl)}" alt="${escapeHtmlPublic(portraitAlt)}" class="teacher-card__portrait" loading="lazy" />
                        </div>

                        <h3 class="teacher-card__name">${escapeHtmlPublic(nombre)}</h3>
                        <p class="teacher-card__specialty">${escapeHtmlPublic(especialidadTexto)}</p>
                    </a>
                `;

                const trigger = card.querySelector('.teacher-card__trigger');
                trigger?.addEventListener('click', event => {
                    event.preventDefault();
                    openTeacherModal(prof, { trigger });
                });

                container.appendChild(card);
            });
        }

        function parseBio(text) {
            if (window.GENTeacherProfiles?.parseBio) {
                return window.GENTeacherProfiles.parseBio(text);
            }
            const sections = { lugar: '', titulos: [], sobreMi: [], teAcompano: [], meDefine: '' };
            if (!text) return sections;
            const normalized = String(text).replace(/\r\n/g, '\n');
            const parts = normalized.split(/(?:^|\n)\s*(LUGAR DE NACIMIENTO|PLACE OF BIRTH|LOCATION|TITULACIONES|QUALIFICATIONS|TITULACI[OÓ]N|QUALIFICATION|SOBRE M[IÍ]|SOBRE\s+[^\n:]+|ABOUT ME|ABOUT\s+[^\n:]+|TRAYECTORIA|BACKGROUND|TE ACOMPA[NÑ]O|TE ACOMPA[NÑ]A EN|TE ACOMPA[NÑ]A|TE ACOMPA[NÑ]O EN|ACOMPA[NÑ]AMIENTO|[AÁ]MBITOS DE SESI[OÓ]N|I SUPPORT YOU|SHE SUPPORTS YOU IN|SHE SUPPORTS YOU|HE SUPPORTS YOU|AREAS OF SUPPORT|SESSION FOCUS|ME DEFINE|LE DEFINE|NOS DEFINE|WHAT DEFINES ME|WHAT DEFINES HER|WHAT DEFINES HIM):\s*/i);

            for (let i = 1; i < parts.length; i += 2) {
                const header = parts[i].toUpperCase();
                const content = parts[i + 1] ? parts[i + 1].trim() : '';
                if (header.includes('LUGAR') || header.includes('PLACE OF BIRTH') || header.includes('LOCATION')) {
                    sections.lugar = content.replace(/,$/, '').trim();
                } else if (header.includes('TITULACION') || header.includes('TITULACIÓN') || header.includes('QUALIFICATION')) {
                    sections.titulos = content.split('\n').map(l => l.replace(/^[\s*\-•]+/g, '').trim()).filter(Boolean);
                } else if (header.includes('SOBRE') || header.includes('TRAYECTORIA') || header.includes('ABOUT') || header.includes('BACKGROUND')) {
                    sections.sobreMi = content.split('\n').map(p => p.trim()).filter(Boolean);
                } else if (header.includes('ACOMPA') || header.includes('SUPPORT') || header.includes('SESI')) {
                    sections.teAcompano = content.split('\n').map(l => l.replace(/^[\s*\-•*]+/g, '').trim()).filter(Boolean);
                } else if (header.includes('DEFINE')) {
                    sections.meDefine = content.replace(/^["'“”«»]+/g, '').replace(/["'“”«»]+$/g, '').trim();
                }
            }
            return sections;
        }

        function cleanModalText(text) {
            return String(text || '')
                .replace(/^[\s*\-•]+/g, '')
                .replace(/\s+/g, ' ')
                .replace(/\s+([,.;:])/g, '$1')
                .trim();
        }

        function prepareModalItems(items) {
            return (Array.isArray(items) ? items : [items])
                .flatMap(item => String(item || '').split(/\n|•/))
                .map(cleanModalText)
                .filter(Boolean)
                .filter(item => !/^(áreas? de acompañamiento|areas? of support):?$/i.test(item));
        }

        function getTeacherModalCopy() {
            if (window.currentLang === 'en') {
                return {
                    about: 'About me',
                    qualifications: 'Qualifications',
                    sessions: 'Session focus',
                    close: 'Close teacher profile'
                };
            }
            return {
                about: 'Sobre mí',
                qualifications: 'Titulaciones',
                sessions: 'Ámbitos de sesión',
                close: 'Cerrar ficha del maestro'
            };
        }

        function renderTeacherModalSection(icon, title, items) {
            const entries = prepareModalItems(items);
            if (!entries.length) return '';
            return `
                <section class="teacher-modal__section">
                    <h4 class="teacher-modal__section-title">
                        <i class="ph-fill ${icon}" aria-hidden="true"></i>
                        <span>${escapeHtmlPublic(title)}</span>
                    </h4>
                    <div class="teacher-modal__section-copy">
                        ${entries.map(item => `<p class="teacher-modal__section-text">${escapeHtmlPublic(item)}</p>`).join('')}
                    </div>
                </section>
            `;
        }

        function openTeacherModal(prof, options = {}) {
            const overlay = document.getElementById('teacher-modal-overlay');
            const body = document.getElementById('teacher-modal-body');
            if (!overlay || !body) return;

            const rawBio = prof.descripcion || prof.bio || '';
            const parsed = parseBio(rawBio);
            const copy = getTeacherModalCopy();
            const nombre = prof.nombre || 'Profesor';
            const esp = getEspecialidadTexto(prof.especialidad) || 'GEN Yoga';
            const photoUrl = prof.foto_cutout || getTeacherCutoutPhoto(nombre);
            const aboutItems = parsed.sobreMi.length ? parsed.sobreMi : [rawBio || esp];
            const qualificationItems = parsed.titulos;
            const sessionItems = parsed.teAcompano.length ? parsed.teAcompano : [esp];
            const quoteText = cleanModalText(parsed.meDefine);
            const locationText = cleanModalText(parsed.lugar);
            const teacherSlug = getTeacherSlug(prof);
            const portraitAlt = window.currentLang === 'en'
                ? `Black-and-white portrait of ${nombre}`
                : `Retrato en blanco y negro de ${nombre}`;

            body.innerHTML = `
                <div class="teacher-modal__layout">
                    <div class="teacher-modal__profile">
                        <div class="teacher-modal__identity">
                            <h3 id="teacher-modal-name" class="teacher-modal__name">${escapeHtmlPublic(nombre)}</h3>
                            <p class="teacher-modal__specialty">${escapeHtmlPublic(esp)}</p>
                        </div>

                        <div class="teacher-modal__portrait-stage">
                            <img src="${escapeHtmlPublic(photoUrl)}" alt="${escapeHtmlPublic(portraitAlt)}" class="teacher-modal__portrait" />
                        </div>

                        ${quoteText ? `<p class="teacher-modal__quote">“${escapeHtmlPublic(quoteText)}”</p>` : '<span aria-hidden="true"></span>'}
                    </div>

                    <div class="teacher-modal__details">
                        ${renderTeacherClassLinks(prof, 'modal')}
                        ${renderTeacherModalSection('ph-user', copy.about, aboutItems)}
                        ${renderTeacherModalSection('ph-graduation-cap', copy.qualifications, qualificationItems)}
                        ${renderTeacherModalSection('ph-heart', copy.sessions, sessionItems)}
                        ${locationText ? `
                            <div class="teacher-modal__meta">
                                <p class="teacher-modal__location">
                                    <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
                                    <span>${escapeHtmlPublic(locationText)}</span>
                                </p>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;

            clearTimeout(teacherModalCloseTimer);
            activeTeacherSlug = teacherSlug;
            lastTeacherModalTrigger = options.trigger instanceof HTMLElement
                ? options.trigger
                : (document.activeElement instanceof HTMLElement ? document.activeElement : null);
            if (options.syncUrl !== false && teacherSlug) {
                updateTeacherUrl(teacherSlug);
            }
            overlay.classList.remove('is-hidden');
            overlay.setAttribute('aria-hidden', 'false');
            overlay.querySelector('.teacher-modal__close')?.setAttribute('aria-label', copy.close);
            document.body.classList.add('teacher-modal-open');

            requestAnimationFrame(() => {
                overlay.classList.add('is-open');
                overlay.querySelector('.teacher-modal__close')?.focus();
            });
        }

        function closeTeacherModal(options = {}) {
            const overlay = document.getElementById('teacher-modal-overlay');
            if (!overlay || overlay.classList.contains('is-hidden')) return;

            overlay.classList.remove('is-open');
            overlay.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('teacher-modal-open');
            activeTeacherSlug = '';
            if (options.syncUrl !== false) {
                updateTeacherUrl('');
            }
            clearTimeout(teacherModalCloseTimer);
            teacherModalCloseTimer = setTimeout(() => overlay.classList.add('is-hidden'), 220);

            if (lastTeacherModalTrigger?.isConnected) {
                lastTeacherModalTrigger.focus();
            }
        }

        function handleTeacherModalBackdrop(event) {
            if (event.target?.id === 'teacher-modal-overlay') closeTeacherModal();
        }

        function syncTeacherModalWithUrl() {
            const requestedSlug = getRequestedTeacherSlug();
            if (requestedSlug) {
                if (requestedSlug !== activeTeacherSlug) {
                    openRequestedTeacherFromUrl();
                }
                return;
            }

            if (activeTeacherSlug) {
                closeTeacherModal({ syncUrl: false });
            }
        }

        function handleTeacherModalKeyboard(event) {
            const overlay = document.getElementById('teacher-modal-overlay');
            if (!overlay || overlay.classList.contains('is-hidden')) return;

            if (event.key === 'Escape') {
                event.preventDefault();
                closeTeacherModal();
                return;
            }

            if (event.key !== 'Tab') return;
            const focusableElements = Array.from(
                overlay.querySelectorAll(
                    'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
                )
            ).filter(element => element instanceof HTMLElement && element.offsetParent !== null);
            if (!focusableElements.length) return;

            const first = focusableElements[0];
            const last = focusableElements[focusableElements.length - 1];
            if (!overlay.contains(document.activeElement)) {
                event.preventDefault();
                first.focus();
            } else if (event.shiftKey && document.activeElement === first) {
                event.preventDefault();
                last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
                event.preventDefault();
                first.focus();
            }
        }

        document.addEventListener('keydown', handleTeacherModalKeyboard);
        window.addEventListener('languageChanged', fetchProfesionalesLanding);
        window.addEventListener('popstate', syncTeacherModalWithUrl);
        </script>
